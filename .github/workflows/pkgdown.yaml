# Based on https://github.com/r-lib/actions/tree/v2/examples
name: Documentation

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the release-version site from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            github::joonho112/multisiteDGP@011db7a2a2ffe7a299cff23d54a51f0528694be5
          needs: website
      - name: Build the documentation site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      - uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site-${{ github.run_id }}
          path: docs
          include-hidden-files: true

  deploy:
    name: Deploy the site from main
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Require a release version
        shell: Rscript {0}
        run: |
          version <- read.dcf("DESCRIPTION", fields = "Version")[[1L]]
          stopifnot(grepl("^[0-9]+[.][0-9]+[.][0-9]+$", version))
      - uses: actions/download-artifact@v7
        with:
          name: pkgdown-site-${{ github.run_id }}
          path: docs
      - uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
