# Based on https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      minimum:
        description: Also check R 4.1 and the exact minimum Imports
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, slow: true}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: macos-26, r: release}
          - {os: windows-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      NOT_CRAN: "true"
      POOLINFO_SLOW: ${{ matrix.config.slow && 'true' || 'false' }}
      POOLINFO_SNAPSHOTS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::joonho112/multisiteDGP@011db7a2a2ffe7a299cff23d54a51f0528694be5
          needs: check
      - name: Check the installed simulation adapter
        if: matrix.config.slow
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("multisiteDGP", quietly = TRUE))
          stopifnot(packageVersion("multisiteDGP") == "0.3.0")
          print(packageDescription("multisiteDGP")[c("Version", "RemoteSha")])
          testthat::test_local(
            filter = "^(adapters|multisitedgp-columns|algebra-reliability|algebra-related)$",
            reporter = "summary", stop_on_failure = TRUE
          )
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: 'c("--no-manual")'

  plot-snapshots:
    name: macOS 26 arm64 (R 4.6.0, stored plots)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      POOLINFO_SNAPSHOTS: "true"
      POOLINFO_SLOW: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      # The plots need no pandoc, and the check for it would resolve every
      # suggested package, including multisiteDGP, which is not on CRAN.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          install-pandoc: false
          extra-packages: |
            any::testthat
            any::withr
            ggplot2@4.0.3
            patchwork@1.3.2
            vdiffr@1.0.9
            svglite@2.2.2
            ragg@1.5.2
            systemfonts@1.3.2
            textshaping@1.0.5
      - name: Compare stored plots with the matching rendering stack
        shell: Rscript {0}
        run: |
          expected <- c(ggplot2 = "4.0.3", patchwork = "1.3.2", vdiffr = "1.0.9",
                        svglite = "2.2.2", ragg = "1.5.2", systemfonts = "1.3.2",
                        textshaping = "1.0.5")
          actual <- vapply(names(expected), function(p) as.character(packageVersion(p)), "")
          stopifnot(identical(actual, expected), getRversion() == "4.6.0")
          print(Sys.info())
          print(actual)
          testthat::test_local(filter = "^plot-snapshots$", reporter = "summary", stop_on_failure = TRUE)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-plot-comparisons
          path: tests/testthat/_snaps

  oldest-R:
    name: R 4.1 with compatible test dependencies
    if: github.event_name == 'workflow_dispatch' && inputs.minimum
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
      POOLINFO_SNAPSHOTS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
      # ebnm needs trust, whose current version needs R 4.2; trust 0.1-8 is
      # the last version that installs on R 4.1.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::cli
            any::knitr
            any::rmarkdown
            any::metafor
            any::posterior
            trust@0.1-8
            any::ebnm
            github::joonho112/multisiteDGP@011db7a2a2ffe7a299cff23d54a51f0528694be5
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          upload-results: true

  minimum-Imports:
    name: R 4.1 with exact minimum Imports (runtime and examples)
    if: github.event_name == 'workflow_dispatch' && inputs.minimum
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/2024-03-15
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          dependencies: '"hard"'
          cache: false
          install-pandoc: false
          extra-packages: |
            rlang@1.1.0
            ggplot2@3.5.0
            patchwork@1.2.0
      # testthat >= 3.2.0 requires rlang >= 1.1.1. The exact rlang 1.1.0
      # runtime is checked with examples and base-R assertions instead.
      # The oldest-R job above runs the package test suite separately.
      - name: Verify versions, examples and runtime behavior
        shell: Rscript {0}
        run: |
          expected <- c(rlang = "1.1.0", ggplot2 = "3.5.0", patchwork = "1.2.0")
          actual <- vapply(names(expected), function(p) as.character(packageVersion(p)), "")
          stopifnot(identical(actual, expected))
          print(actual)
          r <- file.path(R.home("bin"), "R")
          status <- system2(r, c("CMD", "build", "--no-build-vignettes", "--no-manual", "."))
          stopifnot(status == 0L)
          archive <- list.files(pattern = "^poolinfo_.*[.]tar[.]gz$")
          stopifnot(length(archive) == 1L)
          status <- system2(r, c("CMD", "check", "--no-manual", "--no-tests", "--no-vignettes",
                                 "--ignore-vignettes", shQuote(archive)))
          log <- readLines("poolinfo.Rcheck/00check.log", warn = FALSE)
          cat(log, sep = "\n")
          stopifnot(status == 0L, !any(grepl("[1-9][0-9]* (ERROR|WARNING)", log)))
          stopifnot(system2(r, c("CMD", "INSTALL", "--no-docs", shQuote(archive))) == 0L)
          library(poolinfo)
          profile <- reliability_profile(se = c(0.2, 0.3, 0.4), sigma_tau = 0.2)
          stopifnot(is.finite(profile$stats[["I"]]), profile$stats[["I"]] > 0)
          fit <- reliability_posterior(c(-0.4, 0.1, 0.3, 0.5, 0.8), se = rep(0.2, 5))
          stopifnot(all(is.finite(site_table(fit)$effect_sd)))
          stopifnot(inherits(plot_profile(fit), "ggplot"))
          draws <- profile_draws(fit, ndraws = 100, seed = 1, sites = TRUE)
          stopifnot(nrow(draws) == 100L, all(is.finite(as.matrix(draws))))
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimum-Imports-check
          path: poolinfo.Rcheck
