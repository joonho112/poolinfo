# Based on https://github.com/r-lib/actions/tree/v2/examples
name: Test coverage

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      POOLINFO_SNAPSHOTS: "false"
      POOLINFO_SLOW: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            github::joonho112/multisiteDGP@011db7a2a2ffe7a299cff23d54a51f0528694be5
          needs: coverage
      - name: Measure coverage including the simulation adapter
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("multisiteDGP", quietly = TRUE))
          stopifnot(packageVersion("multisiteDGP") == "0.3.0")
          coverage <- covr::package_coverage(
            quiet = FALSE, clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "coverage-package")
          )
          print(coverage)
          covr::to_cobertura(coverage, filename = "coverage.xml")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-results
          path: |
            coverage.xml
            ${{ runner.temp }}/coverage-package
